name: Schwab Token Auto Refresher

on:
  schedule:
    - cron: '0 13 */3 * *'
  workflow_dispatch:
    inputs:
      upload_debug_artifacts:
        description: 'Upload redacted diagnostics on failure for this manual run'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh-token:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Install Pinned Google Chrome & Dependencies
        run: |
          sudo apt-get update
          CHROME_VERSION="147.0.7727.137-1"
          CHROME_DEB="google-chrome-stable_${CHROME_VERSION}_amd64.deb"
          curl -fsSLo "$CHROME_DEB" "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/${CHROME_DEB}"
          sudo apt install -y --allow-downgrades "./${CHROME_DEB}"
          google-chrome --version
          npm ci

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      # SCHWAB_PROXY_URL retired on 2026-11-02; keep the secret, but do not read it.
      - name: Run Refresh Script
        run: npm start
        env:
          SCHWAB_USERNAME: ${{ secrets.SCHWAB_USERNAME }}
          SCHWAB_PASSWORD: ${{ secrets.SCHWAB_PASSWORD }}
          SCHWAB_TOTP_SECRET: ${{ secrets.SCHWAB_TOTP_SECRET }}
          SCHWAB_API_KEY: ${{ secrets.SCHWAB_API_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_SECRET_ID: ${{ vars.GCP_SECRET_ID }}
          SCHWAB_REDIRECT_URI: ${{ vars.SCHWAB_REDIRECT_URI }}

      - name: Alert refresh failure via Telegram
        if: failure()
        run: node scripts/notify_refresh_failure.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TG_TOKEN }}
          GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}

      - name: Stage redacted diagnostics
        id: stage_diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.upload_debug_artifacts == 'true' && hashFiles('*_diagnostics.json') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/redacted-diagnostics"
          cp -- ./*_diagnostics.json "$RUNNER_TEMP/redacted-diagnostics/"

      - name: Scan diagnostics before upload
        id: scan_diagnostics
        if: failure() && steps.stage_diagnostics.outcome == 'success'
        uses: QuantStrategyLab/.github/actions/scan-before-publish@0da4da68433b803cda17d3f84e29875a94a32273 # No release tag published
        with:
          path: ${{ runner.temp }}/redacted-diagnostics

      - name: Upload Redacted Diagnostics
        if: failure() && steps.scan_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redacted-diagnostics
          path: ${{ runner.temp }}/redacted-diagnostics
          retention-days: 1

      - name: Record last success time
        if: success()
        run: |
          printf 'Last successful refresh: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
